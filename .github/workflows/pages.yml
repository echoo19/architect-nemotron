name: pages
# Builds the site (site/) and deploys it to GitHub Pages. It runs only when
# someone starts it from the Actions tab; nothing deploys on a push.
on:
  workflow_dispatch:
    inputs:
      placeholder:
        description: Allow placeholder data (a preview; the page says so in a banner)
        type: boolean
        default: false
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # Only the public repository publishes the site; anywhere else both jobs are skipped.
    if: github.repository == 'echoo19/architect-nemotron'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site
        # --release refuses placeholder data and private markers.
        env:
          PLACEHOLDER: ${{ inputs.placeholder }}
        run: |
          if [ "$PLACEHOLDER" = "true" ]; then
            node site/build.mjs
          else
            node site/build.mjs --release
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
