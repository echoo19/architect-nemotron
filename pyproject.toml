[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "architect"
version = "0.1.0"
description = "A budgeted agent harness compiler with code-enforced quality floors"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
    "prompt-toolkit>=3.0.48",
    "rich>=13.7",
    "cryptography>=44",
]

[project.scripts]
architect = "architect.cli:main"

[project.optional-dependencies]
arc = [
    "arc-agi==0.9.9",
    "arcengine==0.9.3",
]
bench = [
    "pillow>=10.1,<13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "mypy>=1.14",
    "ruff>=0.9",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.setuptools.packages.find]
include = ["architect*"]

[tool.setuptools.package-data]
architect = ["py.typed", "models/*.json", "compiler/*.json", "backends/pi-node/*.json", "backends/pi-node/*.mjs", "backends/pi-node/*.ts", "forge_modes/templates/*.tmpl", "keys/*.pub", "published/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["architect"]

[tool.coverage.run]
source = ["architect"]
branch = true

[tool.coverage.report]
show_missing = true
